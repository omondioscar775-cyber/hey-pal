openapi: 3.1.0
info:
  title: CircleUp API
  version: 1.0.0
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /ready:
    get:
      summary: Readiness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/register:
    post:
      summary: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      summary: Current user
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      summary: Revoke session
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/password-reset/request:
    post:
      summary: Request a reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /auth/password-reset/complete:
    post:
      summary: Consume reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /goals:
    get:
      summary: List goals
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  goals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
                  nextCursor:
                    anyOf:
                      - type: string
                        pattern: ^[a-f0-9]{24}$
                      - type: 'null'
                  count:
                    type: integer
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: before
          in: query
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
    post:
      summary: Create goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - category
                - currentState
                - desiredOutcome
                - weeklyAvailableHours
              properties:
                title:
                  type: string
                category:
                  type: string
                currentState:
                  type: string
                desiredOutcome:
                  type: string
                weeklyAvailableHours:
                  type: number
                  minimum: 1
                  maximum: 168
                description:
                  type: string
                targetDate:
                  type: string
                motivation:
                  type: string
                priority:
                  type: string
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  goal:
                    $ref: '#/components/schemas/Goal'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /goals/{id}:
    get:
      summary: Read goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  goal:
                    $ref: '#/components/schemas/Goal'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Edit goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                targetDate:
                  type: string
                category:
                  type: string
                currentState:
                  type: string
                desiredOutcome:
                  type: string
                weeklyAvailableHours:
                  type: number
                  minimum: 1
                  maximum: 168
                motivation:
                  type: string
                priority:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  goal:
                    $ref: '#/components/schemas/Goal'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete goal and its tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /goals/{id}/archive:
    post:
      summary: Archive goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  goal:
                    $ref: '#/components/schemas/Goal'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /roadmaps:
    get:
      summary: List versions
      parameters:
        - name: goalId
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: before
          in: query
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  roadmaps:
                    type: array
                    items:
                      $ref: '#/components/schemas/Roadmap'
                  nextCursor:
                    anyOf:
                      - type: string
                        pattern: ^[a-f0-9]{24}$
                      - type: 'null'
                  count:
                    type: integer
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create roadmap or draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - goalId
                - title
              properties:
                goalId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                title:
                  type: string
                status:
                  type: string
                milestones:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - title
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      targetDate:
                        type: string
                      completed:
                        type: boolean
                      _id:
                        type: string
                generationMethod:
                  type: string
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  roadmap:
                    $ref: '#/components/schemas/Roadmap'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /roadmaps/{id}:
    get:
      summary: Read roadmap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  roadmap:
                    $ref: '#/components/schemas/Roadmap'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Edit roadmap and ordered milestones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                milestones:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - title
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      targetDate:
                        type: string
                      completed:
                        type: boolean
                      _id:
                        type: string
                status:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  roadmap:
                    $ref: '#/components/schemas/Roadmap'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete draft or archive accepted roadmap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /roadmaps/{id}/validation:
    get:
      summary: Validate roadmap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  valid:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /roadmaps/{id}/approve:
    post:
      summary: Approve reviewed draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - updatedAt
              properties:
                version:
                  type: integer
                updatedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  roadmap:
                    $ref: '#/components/schemas/Roadmap'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /roadmaps/{id}/milestones:
    get:
      summary: List ordered milestones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  milestones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Milestone'
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /tasks:
    get:
      summary: List tasks
      parameters:
        - name: goalId
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - name: roadmapId
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
        - name: isEssential
          in: query
          required: false
          schema:
            type: boolean
        - name: before
          in: query
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  nextCursor:
                    anyOf:
                      - type: string
                        pattern: ^[a-f0-9]{24}$
                      - type: 'null'
                  count:
                    type: integer
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - goalId
                - roadmapId
                - title
                - scheduledDate
                - estimatedMinutes
              properties:
                goalId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                roadmapId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                title:
                  type: string
                scheduledDate:
                  type: string
                estimatedMinutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                milestoneId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
                description:
                  type: string
                dueAt:
                  type: string
                  format: date-time
                priority:
                  type: string
                status:
                  type: string
                isEssential:
                  type: boolean
                dependsOn:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  task:
                    $ref: '#/components/schemas/Task'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /tasks/{id}:
    get:
      summary: Read task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  task:
                    $ref: '#/components/schemas/Task'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Edit task or prerequisites
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                scheduledDate:
                  type: string
                dueAt:
                  type: string
                  format: date-time
                estimatedMinutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                priority:
                  type: string
                status:
                  type: string
                isEssential:
                  type: boolean
                dependsOn:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  task:
                    $ref: '#/components/schemas/Task'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /planner/availability:
    get:
      summary: Read availability
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  availability:
                    anyOf:
                      - $ref: '#/components/schemas/Availability'
                      - type: 'null'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Replace availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timezone
                - weeklyWindows
              properties:
                timezone:
                  type: string
                weeklyWindows:
                  type: array
                  items:
                    type: object
                    required:
                      - day
                      - start
                      - end
                    properties:
                      day:
                        type: integer
                        minimum: 0
                        maximum: 6
                      start:
                        type: integer
                        minimum: 0
                        maximum: 1439
                      end:
                        type: integer
                        minimum: 1
                        maximum: 1440
                closedDates:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  availability:
                    $ref: '#/components/schemas/Availability'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /planner/capacity:
    get:
      summary: Calculate free intervals
      parameters:
        - name: startAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  availableMinutes:
                    type: integer
                  intervals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Interval'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /planner/blocks:
    get:
      summary: Read schedule
      parameters:
        - name: startAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  blocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Block'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Reserve interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - startAt
                - endAt
                - requestKey
              properties:
                type:
                  type: string
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                requestKey:
                  type: string
                taskId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  block:
                    $ref: '#/components/schemas/Block'
                required:
                  - success
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  block:
                    $ref: '#/components/schemas/Block'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /planner/blocks/{id}:
    delete:
      summary: Cancel reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  block:
                    $ref: '#/components/schemas/Block'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /planner/preview:
    post:
      summary: Validate proposed interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - startAt
                - endAt
              properties:
                type:
                  type: string
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                taskId:
                  type: string
                  pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  block:
                    $ref: '#/components/schemas/Block'
                required:
                  - success
        default:
          $ref: '#/components/responses/Error'
  /planner/preview-plan:
    post:
      summary: Review a group of proposed intervals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - blocks
              properties:
                blocks:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    required:
                      - type
                      - startAt
                      - endAt
                    properties:
