        email:
          type: string
          format: email
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
    Goal:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[a-f0-9]{24}$
        userId:
          type: string
          pattern: ^[a-f0-9]{24}$
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
        description:
          type: string
        category:
          type: string
        currentState:
          type: string
        desiredOutcome:
          type: string
        motivation:
          type: string
        targetDate:
          type: string
          format: date-time
        weeklyAvailableHours:
          type: number
        priority:
          type: string
        status:
          type: string
