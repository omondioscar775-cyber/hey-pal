components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Success:
      description: Successful response with resource fields as described in BACKEND.md.
      content:
        application/json:
          schema:
            type: object
            required:
              - success
            properties:
              success:
                const: true
    Error:
      description: Validation, authorization, conflict, infeasibility, throttling or service error.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                const: false
              message:
                type: string
              requestId:
                type: string
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items: {}
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{24}$
