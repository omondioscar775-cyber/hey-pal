              properties:
                _id:
                  type: string
                  pattern: ^[a-f0-9]{24}$
                title:
                  type: string
            - type: 'null'
        title:
          type: string
        version:
          type: integer
        status:
          type: string
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
        generationMethod:
